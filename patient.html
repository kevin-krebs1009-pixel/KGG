<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B66">
<meta name="robots" content="noindex">
<title>Mein KGG-Training</title>
<style>
:root{--bg:#F3F5F6;--surface:#fff;--sunk:#E9EDEF;--line:#D5DCDF;--ink:#16232B;--muted:#5A6A73;--accent:#0E6B66;--accent-ink:#fff;--soft:#DCEEEC;--danger:#B3261E;--danger-soft:#FBE4E2;--good:#2F8A5B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F171B;--surface:#172329;--sunk:#1E2D34;--line:#2C3E46;--ink:#E4ECEF;--muted:#9AAEB7;--accent:#4FC2B8;--accent-ink:#06211F;--soft:#16383A;--danger:#F08A82;--danger-soft:#3D1D1B;--good:#6CCB97;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F171B;--surface:#172329;--sunk:#1E2D34;--line:#2C3E46;--ink:#E4ECEF;--muted:#9AAEB7;--accent:#4FC2B8;--accent-ink:#06211F;--soft:#16383A;--danger:#F08A82;--danger-soft:#3D1D1B;--good:#6CCB97;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",Verdana,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-left,0px)) 40px max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font:700 24px Arial,sans-serif;margin:0}
h2{font:700 19px Arial,sans-serif;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.skip{opacity:.5}
.ex-head{display:flex;align-items:center;gap:10px}
.ex-head input{width:26px;height:26px;accent-color:var(--accent);flex:none}
.ex-head b{font-size:18px}
.meta{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
input,select,textarea{font:inherit;font-size:18px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0;text-transform:none;letter-spacing:normal;font-weight:400}
input.num{text-align:center;font-variant-numeric:tabular-nums}
textarea{min-height:60px;font-size:16px}
.step{display:flex}
.step button{width:44px;flex:none;font:700 22px Arial,sans-serif;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.step button:first-child{border-radius:8px 0 0 8px}.step button:last-child{border-radius:0 8px 8px 0}
.step input{border-radius:0;border-left:none;border-right:none}
.k-wide{grid-column:1/-1}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.prog svg{flex:none}
.up{color:var(--good);font-weight:700}
.warn{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:14px}
.btn{font:inherit;font-weight:700;font-size:18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:14px;cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qr{background:#fff;border-radius:12px;padding:14px;display:flex;justify-content:center}
.qr svg{width:100%;max-width:480px;height:auto;display:block}
.qr{padding:18px}
.hint{color:var(--muted);font-size:15px;margin:8px 0}
.vals{width:100%;border-collapse:collapse;margin:8px 0}.vals td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}.vals td:first-child{font-weight:700;width:45%}
.big{font-size:18px;text-align:center}
.err{padding:20px;text-align:center}
button.card{font:inherit;text-align:left;color:inherit;cursor:pointer;width:100%}
.exl-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exl-head b{font-size:19px}
.exl.isdone{opacity:.7}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--soft);color:var(--good)}
.pill.run{background:var(--soft);color:var(--accent)}
.pill.open{background:var(--danger-soft);color:var(--danger)}
.info.sk svg{display:block;width:100%;height:auto;border-radius:8px;margin-top:4px}
.info{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.info span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.info b{font-size:17px}
.info p{margin:0;font-size:16px}
.setrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.setrow.ok{flex-direction:row;justify-content:space-between;background:var(--soft);border-color:transparent}
.setrow.next{flex-direction:row;justify-content:space-between;opacity:.5}
.setrow.cur{border:2px solid var(--accent)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.pause{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:4px}
.pause span{font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.pause b{font:700 56px Arial,sans-serif;font-variant-numeric:tabular-nums}
.done-msg{text-align:center;padding:30px 16px}
.done-msg b{font-size:22px;color:var(--good)}
</style></head><body>
<div class="wrap" id="app"><div class="card err">Wird geladen …</div></div>

      img += '"';

const CAT={"Beinpresse":"Rücken und Becken fest an der Lehne, Füße hüftbreit auf der Platte. Beine strecken, ohne die Knie ganz durchzudrücken. Knie bleiben über den Füßen, nicht nach innen fallen lassen. Langsam zurück bis zur eingestellten Beugung.","Beinpresse einbeinig":"Ein Fuß mittig auf der Platte, anderes Bein locker abgestellt. Becken bleibt gerade auf dem Sitz. Knie zeigt in Richtung zweiter Zeh. Kontrolliert strecken und langsam zurück.","Beinstrecker (Knieextension)":"Kniegelenk auf Höhe der Drehachse des Geräts, Polster oberhalb des Sprunggelenks. Rücken an der Lehne, an den Griffen festhalten. Unterschenkel bis zur eingestellten Grenze strecken, kurz halten, langsam absenken.","Beinbeuger sitzend":"Knie auf Höhe der Drehachse, Oberschenkelpolster fest. Unterschenkel gegen das Polster nach unten-hinten beugen. Becken bleibt auf dem Sitz, kein Hohlkreuz. Langsam zurückführen.","Wadenheben (Wadenmaschine)":"Fußballen auf der Kante, Knie gestreckt aber nicht überstreckt. Fersen so hoch wie möglich anheben, oben kurz halten. Fersen langsam unter die Kante absenken.","Hüftabduktion Kabelzug":"Seitlich zum Kabelzug stehen, Schlaufe am äußeren Fuß, am Gerät festhalten. Rumpf aufrecht, Becken gerade. Bein gestreckt seitlich abspreizen, ohne den Oberkörper zu kippen. Langsam zurück.","Hüftadduktion Kabelzug":"Seitlich zum Kabelzug stehen, Schlaufe am inneren Fuß. Rumpf aufrecht. Bein gestreckt vor dem Standbein vorbei nach innen ziehen. Langsam zurückführen.","Hüftextension Kabelzug":"Mit Blick zum Gerät stehen, Schlaufe am Fuß, festhalten. Bauch leicht anspannen. Bein gestreckt nach hinten führen, ohne ins Hohlkreuz zu gehen. Langsam zurück.","Latzug":"Oberschenkel unter dem Polster fixiert, Stange etwas weiter als schulterbreit greifen. Brust aufrichten, Schultern nach hinten-unten ziehen. Stange vor dem Körper zur oberen Brust ziehen. Langsam nach oben führen.","Rudern sitzend":"Aufrecht sitzen, Brust ggf. am Polster. Griffe zum Bauch ziehen, Ellenbogen nah am Körper, Schulterblätter zusammenführen. Kein Schwung aus dem Rumpf. Langsam nach vorn zurück.","Brustpresse":"Sitzhöhe so, dass die Griffe auf Brusthöhe sind. Rücken an der Lehne, Schultern unten. Griffe nach vorn drücken, Ellenbogen nicht ganz durchstrecken. Langsam zurück, Schultern bleiben an der Lehne.","Schulterpresse":"Rücken an der Lehne, Bauch leicht angespannt. Griffe von Schulterhöhe nach oben drücken, ohne ins Hohlkreuz zu gehen. Ellenbogen nicht ganz durchstrecken. Langsam absenken.","Butterfly reverse":"Brust am Polster, Arme leicht gebeugt nach vorn. Arme in einem Bogen nach hinten-außen führen, Schulterblätter zusammen. Schultern nicht hochziehen. Langsam zurück.","Außenrotation Kabelzug":"Seitlich zum Kabelzug, Ellenbogen 90° gebeugt und am Körper (Handtuchrolle zwischen Arm und Rumpf). Unterarm nach außen drehen, Ellenbogen bleibt am Körper. Langsam zurück.","Innenrotation Kabelzug":"Seitlich zum Kabelzug, Ellenbogen 90° gebeugt und am Körper. Unterarm vor den Bauch nach innen drehen, Ellenbogen bleibt am Körper. Langsam zurück.","Rückenstrecker":"Becken und Oberschenkel fixiert, Arme vor der Brust verschränkt. Aus leichter Vorneigung den Oberkörper aufrichten bis zur geraden Linie, nicht überstrecken. Langsam zurück.","Bauchmaschine":"Aufrecht sitzen, Polster vor der Brust oder Griffe fassen. Oberkörper Wirbel für Wirbel nach vorn einrollen, ausatmen. Nicht mit den Armen ziehen. Langsam aufrichten.","Rumpfrotation":"Becken fixiert, aufrecht sitzen. Oberkörper gleichmäßig zur Seite drehen bis zur eingestellten Grenze. Kopf dreht mit. Langsam zurück zur Mitte.","Bizepscurl Kabelzug":"Aufrecht stehen, Ellenbogen am Körper. Griff durch Beugen im Ellenbogen nach oben führen, Schultern bleiben ruhig. Langsam strecken, ohne Schwung.","Trizepsdrücken Kabelzug":"Aufrecht stehen, Ellenbogen am Körper. Griff nach unten drücken, bis die Arme gestreckt sind. Oberarme bewegen sich nicht. Langsam zurück bis 90°.","Wadenheben sitzend":"Fußballen auf der Kante, Polster auf den Oberschenkeln knapp über dem Knie. Fersen so hoch wie möglich anheben, oben kurz halten, langsam tief absenken.","Kniebeuge Multipresse":"Stange auf dem oberen Rücken, Füße hüftbreit leicht vor dem Körper. Gesäß nach hinten-unten bis zur freigegebenen Tiefe, Knie über den Füßen, Rücken gerade. Über die ganze Fußsohle hochdrücken.","Ausfallschritt Multipresse":"Schrittstellung, Stange auf dem oberen Rücken. Hinteres Knie senkrecht Richtung Boden absenken, vorderes Knie bleibt über dem Fuß. Oberkörper aufrecht, über die vordere Ferse hochdrücken.","Step-up":"Ganzen Fuß auf die Box stellen. Über das vordere Bein aufsteigen, ohne sich mit dem hinteren abzustoßen. Knie zeigt in Richtung zweiter Zeh. Langsam und kontrolliert absteigen.","Kreuzheben Kabelzug / Trapbar":"Hüftbreit stehen, Griff dicht am Körper. Rücken gerade, aus der Hüfte nach vorne neigen und Knie leicht beugen. Über Hüft- und Kniestreckung aufrichten, Schulterblätter hinten-unten.","Hip Thrust (Gerät)":"Oberer Rücken an der Bank, Polster auf dem Becken, Füße hüftbreit. Becken anheben bis Oberkörper und Oberschenkel eine Linie bilden, Gesäß oben anspannen. Kein Hohlkreuz, langsam absenken.","Abduktorenmaschine":"Aufrecht sitzen, Rücken an der Lehne, Polster außen an den Knien. Beine gleichmäßig nach außen drücken, kurz halten, langsam zurückführen.","Adduktorenmaschine":"Aufrecht sitzen, Polster innen an den Knien, Bewegungsumfang schmerzfrei einstellen. Beine gleichmäßig zusammendrücken, langsam wieder öffnen.","Glute Kickback (Gerät)":"Unterarme bzw. Brust am Polster, Fuß an der Platte. Bein nach hinten-oben strecken, Bauch angespannt, kein Hohlkreuz. Langsam zurück.","Hüftbeugung Kabelzug":"Mit dem Rücken zum Kabelzug stehen, Schlaufe am Fuß, festhalten. Knie gestreckt oder gebeugt nach vorne-oben führen, Rumpf bleibt aufrecht. Langsam zurück.","Rudern Kabelzug einarmig":"Schrittstellung, freie Hand abstützen. Griff zur Hüfte ziehen, Ellenbogen nah am Körper, Schulterblatt nach hinten-unten. Kein Mitdrehen des Rumpfes. Langsam nach vorne.","Latzug eng / neutral":"Oberschenkel fixiert, enger Neutralgriff. Brust aufrichten, Griff zur oberen Brust ziehen, Ellenbogen nah am Körper. Langsam nach oben führen.","Klimmzug assistiert":"Knie auf dem Polster, Griff etwas weiter als schulterbreit. Schulterblätter zuerst nach unten ziehen, dann bis Kinn über Griffhöhe ziehen. Langsam ablassen.","Butterfly":"Rücken an der Lehne, Arme leicht gebeugt auf Schulterhöhe. Arme vor der Brust im Bogen zusammenführen, Schultern bleiben unten. Langsam öffnen bis zur eingestellten Grenze.","Brustpresse schräg":"Sitzhöhe so, dass die Griffe auf Höhe der oberen Brust sind. Schräg nach oben-vorne drücken, Ellenbogen nicht ganz durchstrecken. Langsam zurück.","Pull-over Kabelzug":"Vor dem Kabelzug stehen, Arme fast gestreckt oben am Seil. Arme im Bogen bis zu den Oberschenkeln ziehen, Rumpf stabil. Langsam zurück nach oben.","Face Pull":"Seil auf Augenhöhe, Griff mit Daumen nach hinten. Seil Richtung Gesicht ziehen, Ellenbogen hoch und nach außen, Hände enden neben den Ohren. Schulterblätter zusammen, langsam zurück.","Seitheben Kabelzug":"Seitlich zum Kabelzug, Griff in der körperfernen Hand. Arm leicht gebeugt seitlich bis Schulterhöhe anheben, Schulter nicht hochziehen. Langsam absenken.","Frontheben Kabelzug":"Rücken zum Kabelzug, Griff neben dem Körper. Arm leicht gebeugt nach vorne bis Schulterhöhe heben, Rumpf ruhig. Langsam absenken.","Schulterflexion Kabelzug":"Rücken zum Kabelzug, Arm gestreckt. Arm im schmerzfreien Bereich nach vorne-oben führen, Schulter bleibt unten. Langsam zurück.","Scapula-Depression Latzug":"Arme gestreckt an der Stange, Ellenbogen bleiben gestreckt. Nur die Schulterblätter nach hinten-unten ziehen, kurz halten, langsam nach oben lassen.","Außenrotation 90° Abduktion":"Oberarm auf Schulterhöhe seitlich, Ellenbogen 90° gebeugt, Kabel von vorne. Unterarm nach oben-hinten drehen, Oberarm bleibt auf Höhe. Langsam zurück.","Rückenstrecker 45° (Hyperextension)":"Hüfte knapp über dem Polster, Füße fixiert. Mit geradem Rücken aus der Hüfte nach vorne beugen und bis zur Körperlinie aufrichten, nicht überstrecken.","Pallof Press":"Seitlich zum Kabelzug, Griff mit beiden Händen vor der Brust. Arme nach vorne strecken, dem Zug zur Seite nicht nachgeben, Becken bleibt gerade. Kurz halten, zurück zur Brust.","Holzhacker Kabelzug":"Seitlich zum Kabelzug, Griff oben mit beiden Händen. Diagonal nach unten zur gegenüberliegenden Hüfte ziehen, Rotation aus dem Brustkorb, Becken stabil. Langsam zurück.","Seitbeuge Kabelzug":"Seitlich zum Kabelzug, Griff in der körpernahen Hand. Oberkörper zur Gegenseite aufrichten und leicht neigen, nicht nach vorne kippen. Langsam zurück.","Bizepsmaschine":"Oberarme auf dem Polster, Ellenbogen auf Höhe der Drehachse. Griffe zur Schulter beugen, Schultern bleiben ruhig. Langsam strecken.","Trizepsmaschine / Dips-Maschine":"Aufrecht sitzen, Ellenbogen nah am Körper. Griffe nach unten drücken bis die Arme gestreckt sind, Schultern bleiben unten. Langsam zurück bis 90°.","Handgelenk Flexion / Extension":"Unterarm auf dem Oberschenkel oder Polster abgelegt, Hand über der Kante. Handgelenk langsam beugen bzw. strecken, Unterarm bleibt liegen.","Pronation / Supination":"Unterarm abgelegt, Ellenbogen 90° gebeugt, Stab oder Hantel in der Hand. Unterarm langsam nach innen und außen drehen, Ellenbogen bleibt am Körper.","Fahrradergometer":"Sattelhöhe so, dass das Knie unten fast gestreckt ist. Gleichmäßig treten, Belastung nach Vorgabe (Watt / Puls). Zum Aufwärmen 5–10 Minuten.","Crosstrainer":"Aufrecht stehen, ganze Fußsohle auf den Pedalen. Gleichmäßige, runde Bewegung, Arme schwingen mit. Belastung nach Vorgabe.","Laufband":"Aufrecht gehen, nicht an den Griffen festhalten wenn möglich. Tempo und Steigung nach Vorgabe, bei Unsicherheit Sicherheitsleine anlegen.","Oberkörperergometer":"Sitzhöhe so, dass die Kurbel auf Schulterhöhe ist. Gleichmäßig kurbeln, Rumpf ruhig. Belastung nach Vorgabe.","Kabelzug-Crossover (Brust)":"Zwischen den Türmen, Schrittstellung, Rumpf leicht vorgeneigt. Arme mit leicht gebeugten Ellenbogen im Bogen vor der Brust zusammenführen, langsam öffnen, Schultern bleiben unten.","Brustpresse Kabelzug einarmig":"Rücken zum Turm, Schrittstellung. Griff auf Brusthöhe nach vorn drücken, ohne den Rumpf mitzudrehen. Kontrolliert zurück.","Rudern Kabelzug stehend beidarmig":"Hüftbreit stehen, Knie leicht gebeugt, Rücken gerade. Griffe zum Bauch ziehen, Schulterblätter zusammen und nach unten, langsam nachgeben.","Rudern Kabelzug sitzend (Rudergriff)":"Aufrecht sitzen, Füße abgestützt, Knie leicht gebeugt. Griff zum Bauch ziehen, Ellenbogen eng, Oberkörper bleibt ruhig.","Reverse Fly Kabelzug":"Kabel überkreuzt auf Schulterhöhe greifen. Arme fast gestreckt seitlich nach hinten öffnen, Schulterblätter zusammen, langsam zurück.","Latziehen Kabelzug einarmig kniend":"Kniend vor dem Turm, Rumpf aufrecht. Griff von oben seitlich zur Schulter ziehen, Schulterblatt nach unten, langsam strecken.","Latziehen gestreckte Arme Kabelzug":"Vor dem Turm, Hüfte leicht gebeugt. Stange mit fast gestreckten Armen vom Kopf zu den Oberschenkeln ziehen, Rumpf stabil.","Trizeps Overhead Kabelzug (Seil)":"Rücken zum Turm, Seil hinter dem Kopf. Ellenbogen zeigen nach vorn und bleiben ruhig, Unterarme nach vorn oben strecken.","Trizeps Kickback Kabelzug":"Oberkörper vorgeneigt, Oberarm am Körper. Unterarm nach hinten strecken, nur das Ellenbogengelenk bewegt sich.","Hammercurl Kabelzug (Seil)":"Aufrecht, Daumen zeigen nach oben. Seil zur Schulter beugen, Ellenbogen am Körper, langsam ablassen.","Bizepscurl Kabelzug einarmig":"Seitlich zum Turm, Griff von unten. Unterarm beugen, Oberarm bleibt ruhig am Körper.","Goblet Squat Kabelzug":"Griff vor der Brust, schulterbreit stehen. In die Kniebeuge sinken, Knie über den Füßen, Rücken gerade, kräftig aufrichten.","Rumänisches Kreuzheben Kabelzug":"Griff vom tiefen Zug, Knie leicht gebeugt. Hüfte nach hinten schieben, Rücken gerade, bis Dehnung hinten im Oberschenkel, Hüfte nach vorn strecken.","Pull-Through Kabelzug":"Rücken zum Turm, Seil zwischen den Beinen. Hüfte nach hinten beugen, dann Gesäß anspannen und Hüfte nach vorn strecken.","Ausfallschritt Kabelzug":"Griff(e) vom tiefen Zug, Schrittstellung. Hinteres Knie Richtung Boden senken, vorderes Knie stabil über dem Fuß.","Kniestreckung Kabelzug stehend (Fußschlaufe)":"Fußschlaufe am Sprunggelenk, Gesicht vom Turm weg. Bein aus leichter Beugung nach vorn strecken, Becken stabil.","Kniebeugung Kabelzug stehend (Fußschlaufe)":"Fußschlaufe am Sprunggelenk, Gesicht zum Turm. Ferse Richtung Gesäß ziehen, Oberschenkel bleibt senkrecht.","Dorsalextension Sprunggelenk Kabelzug":"Sitzend, Schlaufe am Vorfuß, Zug von vorn. Fußspitze zum Körper ziehen, langsam nachgeben.","Rumpfrotation Kabelzug stehend":"Seitlich zum Turm, Griff auf Brusthöhe mit gestreckten Armen. Oberkörper kontrolliert wegdrehen, Becken bleibt nach vorn gerichtet.","Lift Kabelzug (tief nach hoch)":"Seitlich zum Turm, Griff unten. Diagonal nach oben über die gegenüberliegende Schulter ziehen, Rumpf stabil, langsam zurück.","Pallof Press kniend":"Kniestand seitlich zum Turm, Griff vor der Brust. Arme nach vorn strecken, Rumpf gegen die Drehung halten, 2 s halten.","Y-Heben Kabelzug":"Kabel überkreuzt von unten. Arme schräg nach oben in ein Y führen, Daumen nach oben, Schultern nicht hochziehen.","Scapula-Retraktion Kabelzug":"Griffe auf Brusthöhe, Arme gestreckt. Nur die Schulterblätter zusammenziehen und lösen, Arme bleiben gestreckt.","Shrugs Kabelzug":"Griffe vom tiefen Zug, aufrecht. Schultern gerade nach oben ziehen, kurz halten, langsam senken.","Außenrotation Kabelzug mit Handtuchrolle":"Seitlich zum Turm, Handtuchrolle zwischen Ellenbogen und Rumpf. Unterarm nach außen drehen, Ellenbogen 90°.","Bizepscurl Kurzhantel":"Aufrecht, Hanteln seitlich, Handflächen nach vorn. Unterarme beugen, Ellenbogen am Körper, langsam ablassen.","Hammercurl Kurzhantel":"Daumen zeigen nach oben. Hanteln zur Schulter beugen, Oberarme ruhig.","Konzentrationscurl Kurzhantel":"Sitzend, Ellenbogen innen am Oberschenkel abgestützt. Hantel zur Schulter beugen, langsam strecken.","Trizeps Kickback Kurzhantel":"Eine Hand und ein Knie auf der Bank, Oberarm parallel zum Rumpf. Unterarm nach hinten strecken.","Trizeps Overhead Kurzhantel":"Sitzend oder stehend, Hantel mit beiden Händen hinter dem Kopf. Ellenbogen zeigen nach vorn, Arme nach oben strecken.","French Press Kurzhantel liegend":"Rückenlage auf der Bank, Arme senkrecht. Hanteln durch Beugen der Ellenbogen neben den Kopf senken, zurückstrecken.","Schulterdrücken Kurzhantel sitzend":"Aufrecht sitzen, Lehne steil. Hanteln von Schulterhöhe nach oben drücken, ohne Hohlkreuz, langsam zurück.","Arnold Press Kurzhantel":"Start mit Handflächen zum Körper vor den Schultern. Beim Drücken nach oben die Hände nach außen drehen.","Seitheben Kurzhantel":"Aufrecht, Ellenbogen leicht gebeugt. Arme seitlich bis Schulterhöhe heben, Schultern bleiben unten.","Frontheben Kurzhantel":"Hanteln vor den Oberschenkeln. Abwechselnd oder gleichzeitig gestreckt bis Schulterhöhe heben.","Scaption Kurzhantel (Y-Heben)":"Arme ca. 30° vor der Körperebene, Daumen nach oben. Bis Schulterhöhe heben, langsam senken.","Reverse Fly Kurzhantel vorgebeugt":"Oberkörper vorgeneigt (oder bäuchlings auf Schrägbank). Arme seitlich öffnen, Schulterblätter zusammen.","Außenrotation Kurzhantel Seitlage":"Seitlage, Handtuchrolle unter dem oberen Ellenbogen. Unterarm nach oben drehen, Ellenbogen bleibt am Körper.","Prone Y-T-W Kurzhantel":"Bauchlage auf der Schrägbank, leichte Hanteln. Arme nacheinander in Y-, T- und W-Position heben, Schulterblätter aktiv.","Rudern Kurzhantel einarmig":"Hand und Knie auf der Bank, Rücken gerade. Hantel zur Hüfte ziehen, Ellenbogen eng, langsam ablassen.","Bankdrücken Kurzhantel":"Rückenlage, Füße fest am Boden. Hanteln von Brusthöhe nach oben drücken, Ellenbogen ca. 45° vom Körper.","Schrägbankdrücken Kurzhantel":"Bank 30–45° geneigt. Hanteln über der oberen Brust nach oben drücken, kontrolliert absenken.","Fliegende Kurzhantel":"Rückenlage, Arme leicht gebeugt über der Brust. Im Bogen seitlich öffnen bis leichte Dehnung, zurückführen.","Pullover Kurzhantel":"Rückenlage, Hantel mit beiden Händen über der Brust. Mit leicht gebeugten Armen hinter den Kopf senken, zurückführen.","Goblet Squat Kurzhantel":"Hantel senkrecht vor der Brust. In die Kniebeuge sinken, Brust aufrecht, Knie folgen den Fußspitzen.","Ausfallschritt Kurzhantel":"Hanteln seitlich. Großer Schritt nach vorn, hinteres Knie Richtung Boden, zurück in den Stand.","Ausfallschritt rückwärts Kurzhantel":"Hanteln seitlich. Schritt nach hinten, vorderes Knie stabil, aus dem vorderen Bein zurück in den Stand.","Bulgarian Split Squat Kurzhantel":"Hinterer Fuß auf der Bank. Senkrecht nach unten sinken, vorderes Knie über dem Fuß, aus der Ferse hochdrücken.","Rumänisches Kreuzheben Kurzhantel":"Hanteln vor den Oberschenkeln. Hüfte nach hinten schieben, Rücken gerade, Hanteln am Bein entlang bis unters Knie.","Kreuzheben einbeinig Kurzhantel":"Standbein leicht gebeugt, freies Bein nach hinten strecken. Oberkörper und Bein wie eine Waage bewegen, Becken gerade.","Step-up Kurzhantel":"Hanteln seitlich, ganzer Fuß auf der Box. Aus dem vorderen Bein hochdrücken, langsam wieder absteigen.","Wadenheben einbeinig Kurzhantel":"Vorfuß auf einer Stufe, Hantel in der Hand der Trainingsseite. Ferse hoch, langsam unter Stufenniveau senken.","Hip Thrust Kurzhantel":"Schultern an der Bank, Hantel auf dem Becken. Hüfte strecken bis Rumpf und Oberschenkel eine Linie bilden, Gesäß anspannen.","Farmer's Walk Kurzhantel":"Schwere Hanteln seitlich, aufrecht. Mit kurzen, ruhigen Schritten gehen, Schultern unten, Rumpf fest.","Suitcase Carry Kurzhantel":"Eine Hantel auf einer Seite. Aufrecht gehen ohne zur Seite zu kippen.","Shrugs Kurzhantel":"Hanteln seitlich. Schultern gerade nach oben ziehen, kurz halten, langsam senken.","Handgelenkcurl Kurzhantel":"Unterarm auf dem Oberschenkel, Handgelenk über dem Knie. Hantel nur aus dem Handgelenk heben und senken (Beuger oder Strecker).","Radial-/Ulnarabduktion Kurzhantel":"Hantel nur an einem Ende gefasst, Unterarm abgestützt. Handgelenk seitlich auf und ab bewegen.","Kniebeuge Langhantel (Back Squat)":"Stange auf dem oberen Rücken, schulterbreit stehen. Hüfte und Knie beugen, Rücken gerade, Knie über den Füßen, kräftig aufrichten.","Frontkniebeuge Langhantel":"Stange vorn auf den Schultern, Ellenbogen hoch. Aufrecht in die Kniebeuge sinken und hochdrücken.","Box Squat Langhantel":"Hinter dem Körper eine Box. Hüfte nach hinten setzen bis zum kurzen Kontakt mit der Box, ohne abzusitzen wieder aufrichten.","Kreuzheben Langhantel":"Stange über dem Mittelfuß, Rücken gerade, Arme gestreckt. Stange nah am Körper durch Strecken von Hüfte und Knie anheben.","Rumänisches Kreuzheben Langhantel":"Aus dem Stand, Knie leicht gebeugt. Hüfte nach hinten, Stange an den Oberschenkeln entlang bis unters Knie, Rücken gerade.","Good Morning Langhantel":"Stange auf dem oberen Rücken, Knie leicht gebeugt. Oberkörper mit geradem Rücken nach vorn neigen, Hüfte nach hinten, aufrichten.","Hip Thrust Langhantel":"Schultern an der Bank, Stange mit Polster auf dem Becken. Hüfte nach oben strecken, Kinn zur Brust, Gesäß anspannen.","Glute Bridge Langhantel":"Rückenlage auf dem Boden, Stange mit Polster auf dem Becken. Becken anheben bis zur Linie Knie–Hüfte–Schulter.","Ausfallschritt Langhantel":"Stange auf dem oberen Rücken. Schritt nach vorn oder hinten, hinteres Knie Richtung Boden, Oberkörper aufrecht.","Split Squat Langhantel":"Schrittstellung fest, Stange auf dem Rücken. Senkrecht auf und ab bewegen.","Wadenheben Langhantel":"Stange auf dem Rücken, Vorfuß auf einer Platte. Fersen hoch, langsam senken.","Bankdrücken Langhantel":"Rückenlage, Schulterblätter zusammen, Füße fest. Stange zur unteren Brust senken und nach oben drücken.","Schrägbankdrücken Langhantel":"Bank 30–45°. Stange zur oberen Brust senken und nach oben drücken.","Schulterdrücken Langhantel stehend":"Stange vor den Schultern, Gesäß und Bauch fest. Stange senkrecht über den Kopf drücken, ohne Hohlkreuz.","Rudern Langhantel vorgebeugt":"Oberkörper ca. 45° vorgeneigt, Rücken gerade. Stange zum Bauchnabel ziehen, langsam ablassen.","Bizepscurl Langhantel / SZ-Stange":"Aufrecht, Griff schulterbreit. Stange zur Brust beugen, Ellenbogen ruhig, ohne Schwung.","French Press SZ-Stange":"Rückenlage, Stange über der Brust. Unterarme beugen bis die Stange zur Stirn kommt, zurückstrecken.","Shrugs Langhantel":"Stange vor den Oberschenkeln. Schultern gerade hochziehen, kurz halten, senken.","Landmine Press":"Stangenende in der Landmine, freies Ende vor der Schulter. Schräg nach vorn oben drücken, Rumpf fest.","Landmine Rotation":"Stangenende mit beiden Händen vor der Brust. Mit gestreckten Armen in einem Bogen von Seite zu Seite führen, Hüfte dreht mit.","Landmine Squat":"Stangenende vor der Brust. In die Kniebeuge sinken, aufrecht bleiben, hochdrücken.","Kniebeuge Eigengewicht":"Hüftbreit stehen, Arme nach vorn. Hüfte nach hinten setzen, Knie über den Füßen, aufrichten.","Ausfallschritt Eigengewicht":"Schritt nach vorn, hinteres Knie Richtung Boden, Oberkörper aufrecht, zurück in den Stand.","Wandsitzen (Wall Sit)":"Rücken an der Wand, Knie ca. 90° (oder schmerzfrei weniger). Position halten.","Einbeinige Kniebeuge (Pistol assistiert)":"Auf einem Bein, Hand an Stange oder TRX. Kontrolliert so tief beugen wie stabil möglich, Knie bleibt über dem Fuß.","Nordic Hamstring Curl":"Kniend, Fersen fixiert. Oberkörper langsam nach vorn sinken lassen, mit den Händen abfangen, zurückdrücken.","Wadenheben stehend Eigengewicht":"Vorfuß auf einer Stufe, Hand an der Wand. Fersen hoch, langsam senken, auch einbeinig.","Einbeinstand / Balance":"Auf einem Bein stehen, Knie leicht gebeugt. Steigern mit Augen zu, weichem Untergrund oder Armbewegungen.","Glute Bridge":"Rückenlage, Füße aufgestellt. Becken anheben bis /* KGG-Skizzen: schematische Strichfiguren (Start → Ende) für jede Übung. Keine externen Daten. */
const SK=(()=>{
const L={torso:34, neck:3, head:6.5, ua:19, fa:18, th:27, sh:26, ft:8};
const C={ink:"#22313A", far:"#94A3AB", prop:"#C9D2D6", propS:"#6E7F88", acc:"#0E6B66", floor:"#9AA8AE", ghost:"#22313A"};
const rad=a=>a*Math.PI/180, dir=a=>[Math.sin(rad(a)),Math.cos(rad(a))], upv=t=>[Math.sin(rad(t)),-Math.cos(rad(t))];
const add=(p,v,k=1)=>[p[0]+v[0]*k,p[1]+v[1]*k];
function joints(p){
  const H=[0,0], tv=upv(p.t||0), N=add(H,tv,L.torso), S=add(H,tv,L.torso-3+(p.sup||0)), Hd=add(N,upv((p.t||0)+(p.ht||0)),L.neck+L.head);
  const arm=(u,f)=>{ const E=add(S,dir(u),L.ua), W=add(E,dir(f),L.fa); return [E,W]; };
  const leg=(th,sh,ft,thl)=>{ const K=add(H,dir(th),L.th*(thl||1)), A=add(K,dir(sh),L.sh), T=p.front?add(A,dir(sh),2):add(A,dir(ft??(sh+90)),L.ft); return [K,A,T]; };
  const u1=p.u??0, f1=p.f??u1, u2=p.u2??u1, f2=p.f2??(p.u2!=null?p.u2:f1);
  const th1=p.th??0, sh1=p.sh??th1, th2=p.th2??th1, sh2=p.sh2??(p.th2!=null?p.th2:sh1), ft2=p.ft2??(p.th2==null&&p.sh2==null?p.ft:undefined);
  const [E,W]=arm(u1,f1), [E2,W2]=arm(u2,f2);
  const [K,A,T]=leg(th1,sh1,p.ft,p.thl), [K2,A2,T2]=leg(th2,sh2,ft2,p.thl2??p.thl);
  const j={H,N,S,Hd,E,W,E2,W2,K,A,T,K2,A2,T2};
  const at=p.at||["A",58,119], ref=j[at[0]], dx=at[1]-ref[0], dy=at[2]-ref[1];
  for(const k in j) j[k]=[j[k][0]+dx,j[k][1]+dy];
  j.Hn = p.h!=null ? add(j.W,dir(p.h),7) : j.W;
  j.back=add(j.S,upv((p.t||0)-90),4); j.front=add(j.S,upv((p.t||0)+90),5);
  return j;
}
const ln=(a,b,c,w)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const pl=(pts,c,w)=>`<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const rect=(x,y,w,h,r)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r??1.5}" fill="${C.prop}" stroke="${C.propS}" stroke-width="1"/>`;
const circ=(p,r,fill,st)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${fill||C.prop}" stroke="${st||C.propS}" stroke-width="1"/>`;
function figure(j,p,ghost){
  const ink=ghost?C.ghost:C.ink, far=(ghost||p.front)?ink:C.far, o=[];
  o.push(pl([j.S,j.E2,j.W2],far,4.2), pl([j.H,j.K2,j.A2,j.T2],far,4.6));
  o.push(ln(j.H,j.N,ink,6.5), pl([j.H,j.K,j.A,j.T],ink,5), pl([j.S,j.E,j.W],ink,4.5));
  if(p.h!=null) o.push(ln(j.W,j.Hn,ink,3.6));
  o.push(`<circle cx="${j.Hd[0].toFixed(1)}" cy="${j.Hd[1].toFixed(1)}" r="${L.head}" fill="${ink}"/>`);
  return ghost?`<g opacity=".13">${o.join("")}</g>`:o.join("");
}
/* Requisiten, abhängig von den Gelenkpunkten */
function loadAt(kind,pt){
  if(kind==="db") return `${ln([pt[0]-4.5,pt[1]],[pt[0]+4.5,pt[1]],C.propS,2)}${circ([pt[0]-4.5,pt[1]],2.6)}${circ([pt[0]+4.5,pt[1]],2.6)}`;
  if(kind==="kb") return `<path d="M${pt[0]-3.5} ${pt[1]+1} q3.5 -6 7 0" fill="none" stroke="${C.propS}" stroke-width="1.6"/>${circ([pt[0],pt[1]+6],5)}`;
  if(kind==="bar") return circ(pt,8.5)+circ(pt,2,C.propS);
  if(kind==="grip") return circ(pt,2.4,C.propS,C.propS);
  if(kind==="pad") return circ(pt,3.6);
  return "";
}
function props(spec,j,eq,pat){
  const o=[];
  for(const pr of spec){
    const P=k=>Array.isArray(k)?k:j[k];
    switch(pr[0]){
      case "bench": o.push(rect(pr[1],pr[2],pr[3],4), ln([pr[1]+4,pr[2]+4],[pr[1]+4,121],C.propS,1.5), ln([pr[1]+pr[3]-4,pr[2]+4],[pr[1]+pr[3]-4,121],C.propS,1.5)); break;
      case "back": o.push(ln(P(pr[1]),P(pr[2]),C.propS,4)); break; /* Lehne als Linie */
      case "box": o.push(rect(pr[1],pr[2],pr[3],121-pr[2],1)); break;
      case "wall": o.push(`<rect x="${pr[1]-3}" y="8" width="3" height="113" fill="${C.prop}"/>`); break;
      case "mat": o.push(`<rect x="${pr[1]}" y="119" width="${pr[2]}" height="2.5" rx="1" fill="${C.prop}"/>`); break;
      case "pad": o.push(circ(P(pr[1]),pr[2]||3.6)); break;
      case "grip": o.push(loadAt("grip",P(pr[1]))); break;
      case "line": o.push(ln(P(pr[1]),P(pr[2]),C.propS,pr[3]||2)); break;
      case "pole": o.push(ln([pr[1],10],[pr[1],121],C.propS,2.5)); break;
      case "cable": { const a=P(pr[1]), t=pr[2], tx=t[0]; o.push(`<rect x="${tx<60?tx-6:tx}" y="6" width="6" height="115" fill="${C.prop}" stroke="${C.propS}" stroke-width=".8"/>`, circ(t,2.6,"#fff"), `<line x1="${t[0]}" y1="${t[1]}" x2="${a[0].toFixed(1)}" y2="${a[1].toFixed(1)}" stroke="${C.acc}" stroke-width="1.1" stroke-dasharray="2 1.5"/>`); break; }
      case "load": { const kind=pr[2]||eq; if(kind) o.push(loadAt(kind,P(pr[1]))); break; }
      case "smith": o.push(ln([pr[1],8],[pr[1],121],C.propS,1.6)); break;
      case "platform": { const a=P(pr[1]), v=dir(pr[2]); o.push(ln(add(a,v,-11),add(a,v,11),C.propS,4)); break; }
      case "bike": o.push(circ([64,104],13,"none"), ln([64,104],[50,72],C.propS,2.5), rect(42,68,16,4), ln([64,104],[80,70],C.propS,2.5), rect(76,64,12,4)); break;
      case "tread": o.push(rect(14,112,96,7,3), ln([100,112],[104,58],C.propS,2.5), rect(96,54,14,5)); break;
      case "xtrainer": o.push(rect(20,112,84,7,3), ln([92,112],[88,40],C.propS,2.5), circ([92,104],10,"none")); break;
      case "armerg": o.push(ln([98,121],[98,60],C.propS,3), circ([96,58],8,"none"), rect(30,80,26,4)); break;
    }
  }
  return o.join("");
}

  const h1=[e[0]-Math.cos(ang-0.5)*5,e[1]-Math.sin(ang-0.5)*5], h2=[e[0]-Math.cos(ang+0.5)*5,e[1]-Math.sin(ang+0.5)*5];
  const s=[a[0]+Math.cos(ang)*3,a[1]+Math.sin(ang)*3];
  return `<line x1="${s[0].toFixed(1)}" y1="${s[1].toFixed(1)}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" stroke="${C.acc}" stroke-width="1.8"/><polygon points="${e[0].toFixed(1)},${e[1].toFixed(1)} ${h1[0].toFixed(1)},${h1[1].toFixed(1)} ${h2[0].toFixed(1)},${h2[1].toFixed(1)}" fill="${C.acc}"/>`;
}
function fitScale(pat){
  let minY=999; for(const p of [pat.a,pat.b]){ const j=joints(p); for(const k in j){ const extra=k==="Hd"?L.head+1:3; minY=Math.min(minY,j[k][1]-extra); } }
  return minY>=4 ? 1 : (121.5-4)/(121.5-minY);
}
function svg(name, geraet, region, skizze, opt){ return draw(resolve(name, geraet, region, skizze), name, opt); }
function code(info){ return [info.key, info.eq||"", (info.cable?"c":"")+(info.smith?"s":"")+(info.landmine?"l":"")].join(":"); }
function fromCode(k){ const [key,eq,fl]=String(k||"").split(":"); if(!P[key]) return null; return {key, eq:eq||null, cable:(fl||"").includes("c"), smith:(fl||"").includes("s"), landmine:(fl||"").includes("l")}; }
function draw(info, name, opt){
  opt=opt||{}; const pat=P[info.key];
  const A=panel(pat, pat.a, info.eq, info), B=panel(pat, pat.b, info.eq, info, pat.a);
  const s=fitScale(pat), tf=s<1?` transform="translate(${(60*(1-s)).toFixed(1)} ${(121.5*(1-s)).toFixed(1)}) scale(${s.toFixed(3)})"`:"";
  let best=null, bd=0; for(const k of ["W","W2","A","A2","T","H","N","K","K2","S"]){ const d=Math.hypot(B.j[k][0]-A.j[k][0],B.j[k][1]-A.j[k][1]); if(d>bd+0.5){ bd=d; best=k; } }
  const arr = best ? arrow(A.j[best], B.j[best]) : "";
  const badge=(x,n)=>`<circle cx="${x}" cy="9" r="6.5" fill="${C.acc}"/><text x="${x}" y="12" font-size="9" font-family="Arial,sans-serif" font-weight="700" fill="#fff" text-anchor="middle">${n}</text>`;
  const w=opt.width?` width="${opt.width}"`:"";
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 128"${w} role="img" aria-label="Skizze ${String(name||"").replace(/[<>&"]/g,"")}: Start und Ende"><rect width="250" height="128" rx="8" fill="#fff"/><g${tf}>${A.svg}</g><line x1="125" y1="8" x2="125" y2="120" stroke="#E3E8EA" stroke-width="1"/><g transform="translate(130 0)"><g${tf}>${B.svg}${arr}</g></g>${badge(10,1)}${badge(140,2)}</svg>`;
}
const patterns=()=>Object.entries(P).map(([k,v])=>[k,v.lbl]);
return {svg, draw, resolve, code, fromCode, patterns, P};
})();

function sketch(x){ try{ const info=SK.fromCode(x.sk)||SK.resolve(x.n,null,null,null); return SK.draw(info,x.n); }catch(e){ return ""; } }
function ausf(x){ return x.a || CAT[x.n] || ""; }
function nSets(x){ const n=parseInt(String(x.s??"").match(/\d+/)?.[0]||"3",10); return Math.min(Math.max(n,1),10); }
function repsFor(x,j){ const parts=String(x.w??"").split("/").map(s=>s.trim()).filter(Boolean); return parts.length>1?(parts[j]??parts[parts.length-1]):(parts[0]||""); }
function kgFor(x,j){ return x.st&&x.st[j]!=null ? fk(x.st[j]) : (x.k??""); }
function initRow(x){ return x.t==="k" ? {sets:[], cur:{kg:kgFor(x,0), reps:repsFor(x,0)}, state:"offen"} : {c:{...(x.p||{})}, state:"offen"}; }
const sc=v=>`<option value="">–</option>`+[...Array(11).keys()].map(n=>`<option ${String(n)===String(v)?"selected":""}>${n}</option>`).join("");
let tick=null;
function render(){ clearInterval(tick); tick=null; if(st.view!=null && D.x[st.view]) return renderEx(st.view); renderList(); }
function stateLbl(x,r){ if(r.state==="fertig") return `<span class="pill ok">✓ erledigt</span>`; if(r.state==="skip") return `<span class="pill">übersprungen</span>`; if(x.t==="k"&&r.sets.length) return `<span class="pill run">${r.sets.length} von ${nSets(x)} Sätzen</span>`; return `<span class="pill open">offen</span>`; }
function renderList(){
  const done=st.e.filter(r=>r.state==="fertig"||r.state==="skip").length;
  const rows=D.x.map((x,i)=>{ const r=st.e[i], sp=spark(x.h,x.m), pt=progText(x);
    return `<button type="button" class="card exl ${r.state==="fertig"?"isdone":""}" data-open="${i}">
      <div class="exl-head"><b>${esc(x.n)}</b>${stateLbl(x,r)}</div>
      ${x.t==="k"?`<div class="meta">${x.g?`<b>${esc(x.g)} kg</b> · `:""}${esc(x.r||"")}</div>`:`<div class="meta">Ausdauer</div>`}
      ${sp||pt?`<div class="prog">${sp}<span>${pt}</span></div>`:""}
    </button>`; }).join("");
  $("#app").innerHTML=`<header><h1>Mein KGG-Training</h1><p class="sub">${esc(D.pr||"")} · ${dd(D.d.slice(5))}${D.d.slice(0,4)}</p></header>
    <p class="sub">Wählen Sie eine Übung aus. Sie sehen dann, wie das Gerät eingestellt wird und wie die Übung geht. ${done} von ${D.x.length} Übungen erledigt.</p>
    ${rows}
    <section class="card"><h2>Wie war es heute?</h2>
      <div class="two"><label>Anstrengung 0–10<select data-f="b">${sc(st.b)}</select></label><label>Schmerz 0–10<select data-f="z">${sc(st.z)}</select></label></div>
      <label>Bemerkung (freiwillig)<textarea data-f="n" placeholder="z. B. Knie hat leicht gezogen">${esc(st.n)}</textarea></label>
    </section>
    <button class="btn" type="button" id="done">Training beenden – Code anzeigen</button>
    <p class="sub">Ihre Eingaben werden nicht ins Internet gesendet. Sie bleiben auf diesem Handy, bis der Code gescannt wird.</p>`;
}
function info(x){ const a=ausf(x), sk=sketch(x);
  return `${sk?`<div class="info sk"><span>Bewegung: 1 Start → 2 Ende</span>${sk}</div>`:""}
    ${x.e?`<div class="info"><span>Einstellung am Gerät</span><b>${esc(x.e)}</b></div>`:""}
    ${a?`<div class="info"><span>So geht die Übung</span><p>${esc(a)}</p></div>`:""}
    ${x.t==="k"?`<div class="info"><span>Ihre Vorgabe</span><b>${x.g?esc(x.g)+" kg · ":""}${esc(x.r||"")}</b></div>`:""}
    ${x.c!=null?`<div class="warn">Höchstens ${fk(x.c)} kg – Vorgabe Ihrer Therapeutin / Ihres Therapeuten.</div>`:""}`; }
function renderEx(i){
  const x=D.x[i], r=st.e[i];
  let body="";
  if(x.t!=="k"){
    body=`<section class="card">${info(x)}<div class="grid">${(x.f||[]).map(f=>`<label>${LBL[f]||f}<input class="num" inputmode="decimal" data-f="${i}:c.${f}" value="${esc(r.c?.[f])}"></label>`).join("")}</div>
      <button class="btn" type="button" data-cfin="${i}">✓ Fertig</button></section>`;
  } else {
    const n=nSets(x), j=r.sets.length, pausing=st.pause && st.pause.i===i && st.pause.end>Date.now();
    const doneRows=r.sets.map((s,k)=>`<div class="setrow ok"><b>✓ Satz ${k+1}</b><span>${s.kg!==""?esc(s.kg)+" kg":"–"} × ${esc(s.reps||"–")}</span></div>`).join("");
    const cur = j<n ? (pausing ? `<div class="pause"><span>Pause</span><b id="pz">–</b><small>Danach geht es mit Satz ${j+1} von ${n} weiter.</small></div>`
      : `<div class="setrow cur"><b>Satz ${j+1} von ${n}</b>
        <div class="grid2"><label>Gewicht (kg)<div class="step"><button type="button" data-st="${i}:-2.5" aria-label="2,5 kg weniger">−</button><input class="num" inputmode="decimal" data-f="${i}:kg" value="${esc(r.cur.kg)}"><button type="button" data-st="${i}:2.5" aria-label="2,5 kg mehr">+</button></div></label>
        <label>Wiederholungen<input class="num" inputmode="numeric" data-f="${i}:reps" value="${esc(r.cur.reps)}"></label></div>
        <button class="btn" type="button" data-setok="${i}">✓ Satz ${j+1} fertig</button>
        <p class="sub">Werte stimmen? Dann einfach abhaken. Sonst vorher ändern.</p></div>`) : "";
    const rest=Array.from({length:Math.max(0,n-j-1)},(_,k)=>`<div class="setrow next"><b>Satz ${j+k+2}</b><span>${esc(kgFor(x,j+k+1))}${kgFor(x,j+k+1)!==""?" kg":""}</span></div>`).join("");
    body=`<section class="card">${info(x)}</section><section class="card"><h2>Ihre Sätze</h2>${doneRows}${cur}${pausing?"":rest}</section>`;
  }
  $("#app").innerHTML=`<button class="btn sec" type="button" id="toList">← Alle Übungen</button>
    <header><h1>${esc(x.n)}</h1></header>${body}
    ${r.state!=="fertig"?`<button class="btn sec" type="button" data-skip="${i}">Übung heute auslassen</button>`:""}`;
  if(st.pause && st.pause.i===i) startTick();
}
function startTick(){ clearInterval(tick); const upd=()=>{ const left=Math.max(0,Math.ceil((st.pause.end-Date.now())/1000)), el=$("#pz");
    if(left<=0){ clearInterval(tick); tick=null; st.pause=null; save(); try{ navigator.vibrate?.([300,150,300]); }catch(e){} render(); return; }
    if(el) el.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0"); }; upd(); tick=setInterval(upd,250); }
function finishEx(i){ st.e[i].state="fertig"; st.view=null; st.pause=null; save();
  $("#app").innerHTML=`<section class="card done-msg"><b>✓ ${esc(D.x[i].n)} geschafft!</b><p>Super. Jetzt die nächste Übung aussuchen.</p></section>`;
  setTimeout(()=>{ window.scrollTo(0,0); render(); }, 1400); }
async function renderQR(){
  clearInterval(tick);
  const out={v:1,s:D.s,e:st.e.map((r,i)=>{ const x=D.x[i];
    if(x.t!=="k") return [i, r.state==="fertig"?1:0, r.c||{}];
    const kgs=r.sets.map(s=>num(s.kg)).filter(v=>!isNaN(v)), reps=r.sets.map(s=>String(s.reps||"").trim()).filter(Boolean);
    const allSame=reps.length && reps.every(v=>v===reps[0]);
    return [i, r.sets.length?1:0, kgs.length?fk(Math.max(...kgs)):"", r.sets.length?String(r.sets.length):"", allSame?reps[0]:reps.join("/")]; }),b:st.b,z:st.z,n:(st.n||"").slice(0,300)};
  const raw=new TextEncoder().encode(JSON.stringify(out)); let txt="KGG1:"+bytesToB64url(raw);
  if("CompressionStream" in window){ try{ const cs=new CompressionStream("deflate-raw"); const buf=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer()); const z="KGG2:"+bytesToB64url(buf); if(z.length<txt.length) txt=z; }catch(e){} }
  if(typeof D.r==="string" && /^https?:\/\/[^\s#]+$/.test(D.r)) txt=D.r+"#a="+txt;
  const q=qrcode(0,"L"); q.addData(txt,"Byte"); q.make();
  const rows=out.e.map(e=>{ const x=D.x[e[0]]; if(!x) return ""; const r=st.e[e[0]];
    const val = x.t!=="k" ? Object.entries(e[2]||{}).filter(([k,v])=>String(v).trim()).map(([k,v])=>`${esc(k)} ${esc(v)}`).join(", ") : (e[1]?`${e[2]?esc(e[2])+" kg · ":""}${e[3]} Sätze${e[4]?" · "+esc(e[4])+" Wdh.":""}`:"");
    return `<tr><td>${esc(x.n)}</td><td>${r.state==="offen"&&!val?"ausgelassen":val||"erledigt"}</td></tr>`; }).join("");
  $("#app").innerHTML=`<header><h1>Fast geschafft</h1></header>
    <p class="big">Bitte zeigen Sie diesen Code Ihrer Therapeutin / Ihrem Therapeuten. Das Tablet liest ihn ein.</p>
    <div class="qr" id="ansQr">${q.createSvgTag({cellSize:8,margin:4,scalable:true})}</div>
    <p class="hint">Tipp: Bildschirm ganz hell stellen und das Handy ruhig ca. 20–30 cm vor die Tablet-Kamera halten.</p>
    <details class="card"><summary><b>Code wird nicht erkannt? Werte anzeigen</b></summary>
      <p class="hint">Diese Werte kann die Therapeutin / der Therapeut auch direkt am Tablet eintragen.</p>
      <table class="vals"><tbody>${rows}</tbody></table>
      <p class="hint">${out.b?`Anstrengung (Borg): ${esc(out.b)} · `:""}${out.z!==""&&out.z!=null?`Schmerz: ${esc(out.z)}`:""}${out.n?`<br>Notiz: ${esc(out.n)}`:""}</p>
    </details>
    <button class="btn sec" type="button" id="back">Zurück</button>`;
  try{ if("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
}
function alertMax(i){ const x=D.x[i]; const w=document.createElement("div"); w.className="warn"; w.textContent=`Mehr als ${fk(x.c)} kg ist für Sie im Moment nicht erlaubt.`; document.querySelector(".setrow.cur")?.appendChild(w); }
document.addEventListener("input",e=>{ const f=e.target.dataset.f; if(!f||!st) return;
  if(f==="b"||f==="z"||f==="n"){ st[f]=e.target.value; save(); return; }
  const [i,k]=f.split(":"), r=st.e[Number(i)]; if(k.startsWith("c.")) (r.c ||= {})[k.slice(2)]=e.target.value; else r.cur[k]=e.target.value; save(); });
document.addEventListener("change",e=>{ const f=e.target.dataset.f; if(f&&/:kg$/.test(f)){ const i=Number(f.split(":")[0]), x=D.x[i], v=num(e.target.value);
  if(x.c!=null && !isNaN(v) && v>x.c){ e.target.value=fk(x.c); st.e[i].cur.kg=e.target.value; save(); alertMax(i); } } });
document.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||!st) return;
  if(b.dataset.open!=null){ st.view=Number(b.dataset.open); save(); window.scrollTo(0,0); render(); return; }
  if(b.id==="toList"){ st.view=null; save(); window.scrollTo(0,0); render(); return; }
  if(b.dataset.st){ const [i,s]=b.dataset.st.split(":"), x=D.x[Number(i)], r=st.e[Number(i)]; let v=num(r.cur.kg); if(isNaN(v)) v=0; v=Math.max(0,Math.round((v+Number(s))*2)/2); if(x.c!=null&&v>x.c){ v=x.c; alertMax(Number(i)); } r.cur.kg=fk(v); save(); const inp=document.querySelector(`[data-f="${i}:kg"]`); if(inp) inp.value=r.cur.kg; return; }
  if(b.dataset.setok!=null){ const i=Number(b.dataset.setok), x=D.x[i], r=st.e[i]; let kg=num(r.cur.kg); if(x.c!=null&&!isNaN(kg)&&kg>x.c) kg=x.c;
    r.sets.push({kg:isNaN(kg)?"":fk(kg), reps:r.cur.reps}); r.state="läuft"; const j=r.sets.length, n=nSets(x);
    if(j>=n){ finishEx(i); return; }
    r.cur={kg:x.st?kgFor(x,j):(isNaN(kg)?"":fk(kg)), reps:repsFor(x,j)};
    if(x.ps>0){ st.pause={i, end:Date.now()+x.ps*1000}; } save(); window.scrollTo(0,0); render(); return; }
  if(b.dataset.cfin!=null){ finishEx(Number(b.dataset.cfin)); return; }
  if(b.dataset.skip!=null){ const i=Number(b.dataset.skip); st.e[i].state="skip"; st.view=null; st.pause=null; save(); window.scrollTo(0,0); render(); return; }
  if(b.id==="done"){ const open=st.e.filter(r=>r.state==="offen").length; if(open && !b.dataset.sure){ b.dataset.sure="1"; b.textContent=`Noch ${open} Übung${open>1?"en":""} offen – trotzdem beenden?`; return; } renderQR().then(()=>window.scrollTo(0,0)); return; }
  if(b.id==="back"){ render(); return; } });
(async()=>{
  try{
    const m=location.hash.match(/[#&]d=([^&]+)/), m2=location.hash.match(/^#k([zj])([a-z2-7]+)$/);
    if(m) D=await decode(decodeURIComponent(m[1])); else if(m2) D=await decodeB32(m2[1], m2[2]); else throw new Error("kein Code"); if(!D||D.v!==1||!Array.isArray(D.x)) throw new Error("ungültig");
    st=load(); if(!st||!st.e||!st.e[0]||!("state" in st.e[0])) st={e:D.x.map(initRow),b:"",z:"",n:"",view:null,pause:null};
    render();
  }catch(e){ $("#app").innerHTML=`<div class="card err"><h2>Code nicht lesbar</h2><p>Bitte scannen Sie den QR-Code am Tablet noch einmal${String(e.message)==="alt"?" oder aktualisieren Sie den Browser auf Ihrem Handy":""}.</p></div>`; }
})();
window.addEventListener("hashchange",()=>location.reload());
})();
</script>
